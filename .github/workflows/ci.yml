name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install
        run: uv pip install -e . pytest pytest-cov ruff mypy
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Typecheck
        run: mypy
      - name: Test
        run: pytest --cov=lithify --cov-report=term-missing
      - name: Simulated end-to-end demo
        run: lithify demo

  sim-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Install
        run: uv pip install -e .
      - name: Simulation sweep (3 orders x noise 0, 0.2)
        run: python eval/sim_sweep.py --orders 3 --noise 0,0.2 --strict

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate plugin manifests
        run: |
          python3 -c "import json,sys; [json.load(open(p)) for p in sys.argv[1:]]" \
            plugin.json .claude-plugin/plugin.json .claude-plugin/marketplace.json \
            .codex-plugin/plugin.json .agents/plugins/marketplace.json hooks/hooks.json
      # Pinned to the Claude Code version this was verified against; --strict fails on directory warnings.
      # The root CLAUDE.md is contributor context (lithify dogfooded on itself), not plugin context,
      # and is the only warning --strict raises, so it is set aside for this check only.
      - name: Claude plugin validate
        run: |
          rm CLAUDE.md
          npx -y @anthropic-ai/claude-code@2.1.309 plugin validate . --profile directory --strict
